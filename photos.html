<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Alexander Haywood | Photos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .photo-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: pointer; /* Lets the user know it is clickable */
        }
        .photo-img:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Modal Styles */
        .image-modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(15, 17, 21, 0.95); 
            backdrop-filter: blur(8px);
        }
        .modal-content {
            margin: auto; 
            display: block; 
            max-width: 90%; 
            max-height: 90vh;
            margin-top: 5vh; 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            object-fit: contain; /* Ensures the whole image is visible */
        }
        .close-modal {
            position: absolute; 
            top: 20px; right: 40px; 
            color: #e8eaed; 
            font-size: 40px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .close-modal:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="dynamic-bg"></div>

    <header>
        <div class="container nav-inner">
            <a class="logo" href="index.html">Alexander Haywood</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="teaching.html">Teaching</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="photos.html" class="accent">Photos</a></li>
            </ul>
        </div>
    </header>

    <section class="section" style="padding-top: 150px; min-height: 100vh;">
        <div class="container reveal">
            <h2>Photos</h2>
            
            <div class="vision-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                <div class="reveal"><img src="assets/DSCF3236.JPG" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF3247.JPG" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF3344.JPG" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF2400.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF1681_1.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF2190-2_1.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF2492-2.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF8288-min.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF7818-min.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF1262.JPG" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF3700-min.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF6783.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF8147-min.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF8149-min.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF1612_1.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/P1000744.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/P1000854.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/P1000596.jpg" alt="Photography" class="photo-img"></div>
                <div class="reveal"><img src="assets/DSCF3890-min.jpg" alt="Photography" class="photo-img"></div>

    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <footer>
        <div class="container footer-content">
            <p>&copy; <span id="year"></span> Alexander Haywood. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Modal Logic for Expandable Photos
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("expandedImg");
            const closeBtn = document.querySelector(".close-modal");
            
            // Attach click event to all photos
            document.querySelectorAll('.photo-img').forEach(img => {
                img.addEventListener('click', function() {
                    modal.style.display = "block";
                    modalImg.src = this.src; // Push clicked image source to the modal
                });
            });
            
            // Close when 'X' is clicked
            closeBtn.addEventListener('click', () => {
                modal.style.display = "none";
            });
            
            // Close when background is clicked
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
